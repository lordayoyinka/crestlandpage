<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crest Nursery and Primary School — In Detail | CrestHive</title>
    <meta name="description" content="A closer look at life and learning at Crest Nursery and Primary School.">
    <link rel="icon" href="./favicon.ico" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Inter:wght@400;500;600;700;800&display=swap">
    <link rel="stylesheet" href="/CSS/style.css">

    <style>
        /* ---------- Basicschool-page-only styles ---------- */
        .bs-hero {
            position: relative;
            min-height: 70vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            overflow: hidden;
        }
        .bs-hero video {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 0;
        }
        .bs-hero::after {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, rgba(11,38,17,.55), rgba(11,38,17,.8));
            z-index: 1;
        }
        .bs-hero-content {
            position: relative;
            z-index: 2;
            max-width: 700px;
            padding: 24px;
            color: #fff;
        }
        .bs-hero-content h1 {
            color: #fff;
            font-size: clamp(28px, 4.4vw, 44px);
            margin: 0 0 14px;
        }
        .bs-hero-content p {
            color: rgba(255,255,255,.9);
            font-size: 16px;
            line-height: 1.7;
            margin: 0;
        }

        .bs-body {
            max-width: 780px;
            margin: 0 auto;
            padding: 80px 24px;
        }
        .bs-body > p {
            font-size: 16px;
            line-height: 1.75;
            margin-bottom: 40px;
        }
        .bs-panel {
            border: 1px solid var(--line);
            border-radius: var(--radius-lg);
            background: var(--cream-100);
            padding: 40px;
        }
        .bs-panel h2 { font-size: 22px; margin: 0 0 18px; }
        .bs-panel ul { list-style: none; margin: 0; padding: 0; }
        .bs-panel li {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            padding: 10px 0;
            border-bottom: 1px solid var(--line);
            font-size: 15px;
            line-height: 1.6;
        }
        .bs-panel li:last-child { border-bottom: none; }
        .bs-panel li::before {
            content: "+";
            font-weight: 700;
            color: var(--rust-600);
            flex-shrink: 0;
        }

        .bs-cta {
            text-align: center;
            border-radius: var(--radius-lg);
            background: linear-gradient(145deg, var(--green-950), var(--green-700));
            padding: 56px 32px;
            color: #fff;
            margin-top: 40px;
        }
        .bs-cta h2 { color: #fff; margin: 0 0 12px; }
        .bs-cta p { color: rgba(255,255,255,.85); margin: 0 0 26px; }

        #email-top-list, #phone-top-list { display: inline-flex; gap: 1em; }
    </style>
</head>

<body>

    <script type="module" src="./jsfiles/site-chrome.js"></script>

    <script type="module" src="https://www.gstatic.com/firebasejs/9.6.0/firebase-app.js"></script>
    <script type="module" src="https://www.gstatic.com/firebasejs/9.6.0/firebase-firestore.js"></script>
    <script type="module" src="./jsfiles/basicschool.js"></script>

    <site-header></site-header>

    <!-- ============ HERO (video, dynamic title/subtitle from the CMS) ============ -->
    <section class="bs-hero">
        <video autoplay loop muted playsinline>
            <source src="/assets/galvideo.mp4" type="video/mp4">
        </video>
        <div class="bs-hero-content">
            <h1 id="herotitle">Crest Nursery and Primary School</h1>
            <p id="herosub"></p>
        </div>
    </section>

    <!-- ============ DETAILS + NOTABLES ============ -->
    <section class="bs-body">
        <p id="detailsText"></p>

        <div class="bs-panel">
            <h2>Know More</h2>
            <ul id="activities-container"></ul>
        </div>

        <div class="bs-cta">
            <h2>Join us for an exciting educational journey!</h2>
            <p>Start the admission process for your child today.</p>
            <a href="admission-process.html"><button class="btn btn--gold">Get Started</button></a>
        </div>
    </section>

    <!-- ============ FOOTER (rendered by site-chrome.js) ============ -->
    <site-footer></site-footer>

    <script src="jsfiles/footer.js" defer></script>
    <script src="jsfiles/enhance.js" defer></script>
</body>

</html>
