<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery | CrestHive International School</title>
    <meta name="description" content="Photos from life at CrestHive International School — activities, sports, clubs, and more.">
    <link rel="icon" href="./favicon.ico" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Inter:wght@400;500;600;700;800&display=swap">
    <link rel="stylesheet" href="/CSS/style.css">

    <style>
        /* ---------- Gallery-page-only styles ---------- */
        .gal-hero {
            padding: 150px 24px 50px;
            text-align: center;
            max-width: 700px;
            margin: 0 auto;
        }
        .gal-hero h1 { font-size: clamp(30px, 4.6vw, 46px); margin: 14px 0 0; }

        .category-navigation {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
            list-style: none;
            margin: 0 0 48px;
            padding: 0 24px;
        }
        .category-navigation a {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 20px;
            border-radius: 999px;
            border: 1px solid var(--line);
            font-size: 14px;
            font-weight: 600;
            color: var(--ink-700);
            background: #fff;
            transition: background .2s ease, color .2s ease, border-color .2s ease;
        }
        .category-navigation a:hover,
        .category-navigation a.active {
            background: var(--green-700);
            border-color: var(--green-700);
            color: #fff;
        }

        .image-grid {
            max-width: var(--container);
            margin: 0 auto 60px;
            padding: 0 24px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 18px;
        }
        .image-container {
            position: relative;
            border-radius: var(--radius-md);
            overflow: hidden;
            aspect-ratio: 4/3;
            box-shadow: var(--shadow-sm);
        }
        .image-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .image-container .overlay {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            padding: 10px 12px;
            background: linear-gradient(0deg, rgba(11,38,17,.85), transparent);
            color: #fff;
            font-size: 13px;
            font-weight: 600;
            opacity: 0;
            transition: opacity .2s ease;
        }
        .image-container:hover .overlay { opacity: 1; }

        .gal-empty {
            text-align: center;
            color: var(--ink-500);
            padding: 40px 24px;
            font-size: 15px;
        }

        #email-top-list, #phone-top-list { display: inline-flex; gap: 1em; }
    </style>
</head>

<body>

    <script type="module" src="./jsfiles/site-chrome.js"></script>

    <script type="module" src="https://www.gstatic.com/firebasejs/9.6.0/firebase-app.js"></script>
    <script type="module" src="https://www.gstatic.com/firebasejs/9.6.0/firebase-firestore.js"></script>
    <script type="module" src="./jsfiles/gallery.js"></script>

    <site-header></site-header>

    <section class="gal-hero">
        <span class="eyebrow eyebrow--center">A Look Inside</span>
        <h1 class="section-title section-title--center">Gallery</h1>
    </section>

    <ul class="category-navigation">
        <li><a href="#" data-category="all" class="active"><i class="fas fa-globe"></i> All</a></li>
        <li><a href="#" data-category="activities"><i class="fas fa-star"></i> Activities</a></li>
        <li><a href="#" data-category="sports"><i class="fas fa-users"></i> Sports</a></li>
        <li><a href="#" data-category="clubs"><i class="fas fa-people-group"></i> Clubs</a></li>
        <li><a href="#" data-category="stakeholders"><i class="fas fa-handshake"></i> Stakeholders</a></li>
    </ul>

    <div class="image-grid"></div>

    <!-- ============ FOOTER (rendered by site-chrome.js) ============ -->
    <site-footer></site-footer>

    <script src="jsfiles/footer.js" defer></script>
    <script src="jsfiles/enhance.js" defer></script>
</body>

</html>
