<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admission Process | CrestHive International School</title>
    <meta name="description" content="How to apply to CrestHive International School — requirements, steps, and how to start your application.">
    <link rel="icon" href="./favicon.ico" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Inter:wght@400;500;600;700;800&display=swap">
    <link rel="stylesheet" href="/CSS/style.css">

    <style>
        /* ---------- Admission-process-page-only styles ---------- */
        .adm-hero {
            position: relative;
            min-height: 60vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            background: url('assets/06.jpg') center/cover no-repeat;
            overflow: hidden;
        }
        .adm-hero::after {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, rgba(11,38,17,.6), rgba(11,38,17,.8));
        }
        .adm-hero-content {
            position: relative;
            z-index: 1;
            max-width: 720px;
            padding: 24px;
            color: #fff;
        }
        .adm-hero-content .eyebrow { color: var(--gold-400); }
        .adm-hero-content h1 {
            color: #fff;
            font-size: clamp(30px, 4.6vw, 48px);
            margin: 14px 0 18px;
        }
        .adm-hero-content p {
            color: rgba(255,255,255,.9);
            font-size: 16.5px;
            line-height: 1.7;
            margin: 0;
        }

        .adm-body {
            max-width: 820px;
            margin: 0 auto;
            padding: 80px 24px;
        }
        .adm-panel {
            border: 1px solid var(--line);
            border-radius: var(--radius-lg);
            background: var(--cream-100);
            padding: 40px;
            margin-bottom: 32px;
        }
        .adm-panel h2 {
            font-size: 24px;
            margin: 0 0 18px;
        }
        .adm-panel ul {
            list-style: none;
            margin: 0;
            padding: 0;
        }
        .adm-panel ul li {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            padding: 10px 0;
            border-bottom: 1px solid var(--line);
            font-size: 15px;
            line-height: 1.6;
        }
        .adm-panel ul li:last-child { border-bottom: none; }
        .adm-panel ul li::before {
            content: "\f00c";
            font-family: "Font Awesome 6 Free";
            font-weight: 900;
            color: var(--green-700);
            margin-top: 3px;
            flex-shrink: 0;
        }
        .adm-see-more {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-top: 18px;
            font-size: 14px;
            font-weight: 700;
            color: var(--rust-600);
        }

        .adm-cta {
            text-align: center;
            border-radius: var(--radius-lg);
            background: linear-gradient(145deg, var(--green-950), var(--green-700));
            padding: 56px 32px;
            color: #fff;
        }
        .adm-cta h2 { color: #fff; margin: 0 0 12px; }
        .adm-cta p { color: rgba(255,255,255,.85); margin: 0 0 26px; }

        #email-top-list, #phone-top-list { display: inline-flex; gap: 1em; }
    </style>
</head>

<body>

    <script type="module" src="./jsfiles/site-chrome.js"></script>

    <script type="module" src="https://www.gstatic.com/firebasejs/9.6.0/firebase-app.js"></script>
    <script type="module" src="https://www.gstatic.com/firebasejs/9.6.0/firebase-firestore.js"></script>
    <script type="module" src="./jsfiles/admission-process.js"></script>

    <site-header></site-header>

    <!-- ============ HERO (dynamic title/text from the CMS) ============ -->
    <section class="adm-hero">
        <div class="adm-hero-content">
            <p class="eyebrow">Admissions</p>
            <h1 id="admpTitle">Admission Process</h1>
            <p id="admpText"></p>
        </div>
    </section>

    <!-- ============ REQUIREMENTS ============ -->
    <section class="adm-body">
        <div class="adm-panel">
            <h2>What You'll Need</h2>
            <ul id="admp_ul"></ul>
        </div>

        <p class="adm-see-more">
            <i class="fas fa-arrow-right"></i>
            <a href="entrance-test.html">See entrance exam requirements for each school &rarr;</a>
        </p>

        <div style="height:32px;"></div>

        <div class="adm-cta">
            <h2>Ready to start your journey with us?</h2>
            <p>Complete the online application form to begin.</p>
            <a href="apply.html"><button class="btn btn--gold">Apply Now</button></a>
        </div>
    </section>

    <!-- ============ FOOTER (rendered by site-chrome.js) ============ -->
    <site-footer></site-footer>

    <script src="jsfiles/footer.js" defer></script>
    <script src="jsfiles/enhance.js" defer></script>
</body>

</html>
